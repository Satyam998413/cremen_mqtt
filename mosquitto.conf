# =================================================================
# Eclipse Mosquitto Configuration for Render Deployment
# =================================================================

# Persistence configuration
persistence true
persistence_location /mosquitto/data/

# Logging setup
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Security settings
allow_anonymous false
password_file /mosquitto/config/pwfile

# -----------------------------------------------------------------
# Listener 1: Standard MQTT TCP Port (Default: 1883)
# Useful for direct TCP connections (Local, VPN, or Private Network)
# -----------------------------------------------------------------
listener 1883
protocol mqtt

# -----------------------------------------------------------------
# Listener 2: MQTT over WebSockets (Port: 8080)
# Required for Render Web Services proxy routing (HTTP/HTTPS -> WS/WSS)
# -----------------------------------------------------------------
listener 8080
protocol websockets
