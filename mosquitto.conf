# =================================================================
# Eclipse Mosquitto Configuration for Render Deployment
# =================================================================

# Persistence configuration
persistence true
persistence_location /mosquitto/data/

# Logging setup
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Security settings
allow_anonymous false
password_file /mosquitto/config/pwfile

# -----------------------------------------------------------------
# Listener 1: MQTT over WebSockets (Port: 8080)
# Serves standard HTTP 200 OK to health check probes via http_dir
# and handles WebSocket MQTT connections on wss://
# -----------------------------------------------------------------
listener 8080
protocol websockets
http_dir /mosquitto/www

# -----------------------------------------------------------------
# Listener 2: Standard MQTT TCP Port (Default: 1883)
# -----------------------------------------------------------------
listener 1883
protocol mqtt
